<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="24" y="38" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#343a40">② 手动配置：项目属性 → 附加包含目录</text>

  <!-- 左侧：属性树 -->
  <rect x="24" y="58" width="220" height="212" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="40" y="88" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#868e96">配置属性</text>
  <text x="52" y="112" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="13" fill="#495057">常规</text>
  <rect x="44" y="124" width="188" height="26" rx="4" fill="#e7f5ff"/>
  <text x="52" y="142" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1971c2">C/C++</text>
  <rect x="44" y="156" width="188" height="24" rx="4" fill="#1971c2"/>
  <text x="52" y="173" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#ffffff">常规</text>
  <text x="52" y="200" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="13" fill="#495057">优化</text>
  <text x="52" y="224" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="13" fill="#495057">预处理器</text>
  <text x="52" y="248" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="13" fill="#495057">代码生成</text>

  <!-- 右侧：属性表格 -->
  <rect x="264" y="58" width="432" height="212" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="276" y="70" width="190" height="30" rx="4" fill="none" stroke="#adb5bd"/>
  <text x="284" y="90" font-family="Consolas, monospace" font-size="13" fill="#495057">Debug  |  x64</text>
  <text x="472" y="90" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="12" fill="#868e96">配置下拉：分别配 Debug/Release</text>
  <rect x="276" y="110" width="408" height="30" rx="4" fill="#e7f5ff" stroke="#1971c2"/>
  <text x="284" y="130" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#1971c2">附加包含目录</text>
  <text x="396" y="130" font-family="Consolas, monospace" font-size="13" fill="#1971c2">D:\libs\glm</text>
  <rect x="612" y="116" width="60" height="18" rx="4" fill="none" stroke="#adb5bd"/>
  <text x="620" y="129" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="11" fill="#495057">▼ 编辑</text>
  <rect x="276" y="152" width="408" height="28" rx="4" fill="#f8f9fa"/>
  <text x="284" y="171" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="14" fill="#495057">附加库目录</text>
  <rect x="276" y="188" width="408" height="28" rx="4" fill="#f8f9fa"/>
  <text x="284" y="207" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="14" fill="#495057">警告等级</text>
  <text x="276" y="252" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="13" fill="#868e96">头文件库（如 glm）只加包含目录；静态库还要加「链接器 → 附加库目录 + 附加依赖项」</text>

  <!-- 按钮 -->
  <rect x="600" y="286" width="96" height="34" rx="6" fill="#1971c2"/>
  <text x="648" y="308" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">确定</text>
</svg>
