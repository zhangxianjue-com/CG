<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="24" y="38" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#343a40">③ 编写代码：main.cpp 里的第一个程序</text>

  <!-- 编辑器窗口 -->
  <rect x="24" y="66" width="672" height="190" rx="8" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="24" y="66" width="672" height="30" rx="8" fill="#f1f3f5"/>
  <rect x="24" y="76" width="672" height="20" fill="#f1f3f5"/>
  <rect x="32" y="68" width="96" height="22" rx="4" fill="#ffffff" stroke="#dee2e6"/>
  <text x="48" y="84" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="12" fill="#495057">main.cpp</text>

  <!-- 行号栏 -->
  <rect x="24" y="96" width="44" height="160" fill="#f8f9fa"/>
  <text x="62" y="122" font-family="Consolas, monospace" font-size="14" fill="#adb5bd" text-anchor="end">1</text>
  <text x="62" y="148" font-family="Consolas, monospace" font-size="14" fill="#adb5bd" text-anchor="end">2</text>
  <text x="62" y="174" font-family="Consolas, monospace" font-size="14" fill="#adb5bd" text-anchor="end">3</text>
  <text x="62" y="200" font-family="Consolas, monospace" font-size="14" fill="#adb5bd" text-anchor="end">4</text>
  <text x="62" y="226" font-family="Consolas, monospace" font-size="14" fill="#adb5bd" text-anchor="end">5</text>
  <text x="62" y="252" font-family="Consolas, monospace" font-size="14" fill="#adb5bd" text-anchor="end">6</text>

  <!-- 代码行 -->
  <text x="80" y="122" font-family="Consolas, monospace" font-size="14" fill="#a626a4">#include</text>
  <text x="150" y="122" font-family="Consolas, monospace" font-size="14" fill="#343a40"> &lt;iostream&gt;</text>
  <text x="80" y="174" font-family="Consolas, monospace" font-size="14" fill="#a626a4">int</text>
  <text x="104" y="174" font-family="Consolas, monospace" font-size="14" fill="#1971c2"> main</text>
  <text x="150" y="174" font-family="Consolas, monospace" font-size="14" fill="#343a40">() {</text>
  <rect x="76" y="180" width="612" height="24" fill="#e7f5ff"/>
  <text x="80" y="198" font-family="Consolas, monospace" font-size="14" fill="#343a40">    std::cout &lt;&lt; "Hello CG!";</text>
  <text x="80" y="226" font-family="Consolas, monospace" font-size="14" fill="#343a40">    </text>
  <text x="104" y="226" font-family="Consolas, monospace" font-size="14" fill="#a626a4">return</text>
  <text x="150" y="226" font-family="Consolas, monospace" font-size="14" fill="#343a40"> 0;</text>
  <text x="80" y="252" font-family="Consolas, monospace" font-size="14" fill="#343a40">}</text>

  <text x="24" y="282" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="13" fill="#868e96">写完 Ctrl+S 保存，准备调试。std::cout 会把内容打印到控制台窗口</text>
</svg>
