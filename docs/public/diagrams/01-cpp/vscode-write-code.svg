<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="24" y="38" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#343a40">③ 编写代码：main.cpp 里的第一个程序</text>

  <!-- 编辑器窗口 -->
  <rect x="24" y="66" width="672" height="190" rx="8" fill="#1e1e1e"/>
  <rect x="24" y="66" width="672" height="30" rx="8" fill="#252526"/>
  <rect x="24" y="76" width="672" height="20" fill="#252526"/>
  <rect x="32" y="68" width="96" height="22" rx="4" fill="#1e1e1e" stroke="#3c3c3c"/>
  <text x="48" y="84" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="12" fill="#d4d4d4">main.cpp</text>

  <!-- 行号栏 -->
  <rect x="24" y="96" width="44" height="160" fill="#1e1e1e"/>
  <text x="62" y="122" font-family="Consolas, monospace" font-size="14" fill="#858585" text-anchor="end">1</text>
  <text x="62" y="148" font-family="Consolas, monospace" font-size="14" fill="#858585" text-anchor="end">2</text>
  <text x="62" y="174" font-family="Consolas, monospace" font-size="14" fill="#858585" text-anchor="end">3</text>
  <text x="62" y="200" font-family="Consolas, monospace" font-size="14" fill="#858585" text-anchor="end">4</text>
  <text x="62" y="226" font-family="Consolas, monospace" font-size="14" fill="#858585" text-anchor="end">5</text>

  <!-- 代码行（VS Code 深色主题配色） -->
  <text x="80" y="122" font-family="Consolas, monospace" font-size="14" fill="#c586c0">#include</text>
  <text x="150" y="122" font-family="Consolas, monospace" font-size="14" fill="#ce9178"> &lt;iostream&gt;</text>
  <text x="80" y="174" font-family="Consolas, monospace" font-size="14" fill="#569cd6">int</text>
  <text x="104" y="174" font-family="Consolas, monospace" font-size="14" fill="#dcdcaa"> main</text>
  <text x="150" y="174" font-family="Consolas, monospace" font-size="14" fill="#d4d4d4">() {</text>
  <text x="80" y="200" font-family="Consolas, monospace" font-size="14" fill="#d4d4d4">    std::cout &lt;&lt; </text>
  <text x="262" y="200" font-family="Consolas, monospace" font-size="14" fill="#ce9178">"Hello CG!"</text>
  <text x="342" y="200" font-family="Consolas, monospace" font-size="14" fill="#d4d4d4">;</text>
  <text x="80" y="226" font-family="Consolas, monospace" font-size="14" fill="#c586c0">    return</text>
  <text x="136" y="226" font-family="Consolas, monospace" font-size="14" fill="#b5cea8"> 0</text>
  <text x="150" y="226" font-family="Consolas, monospace" font-size="14" fill="#d4d4d4">;</text>

  <text x="24" y="282" font-family="Segoe UI, Microsoft YaHei, Helvetica, sans-serif" font-size="13" fill="#868e96">Ctrl+S 保存；输入 std:: 时 C/C++ 扩展会自动弹出补全候选</text>
</svg>
