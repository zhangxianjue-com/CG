<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 874" width="884" height="874"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      </style></defs><rect x="0" y="0" width="884" height="874" fill="#ffffff"></rect><g transform="translate(12 12) rotate(0 250 17)"><text x="0" y="21.48046875" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="24px" fill="#343a40" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">渲染器原理</text></g><g transform="translate(12 58) rotate(0 300 10)"><text x="0" y="12.5302734375" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="14px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">参考 GAMES101 导论：图形学（游戏工业界）≈ 渲染</text></g><g stroke-linecap="round" transform="translate(12 92) rotate(0 430 105)"><path d="M32 0 C282.52 0, 533.04 0, 828 0 C849.33 0, 860 10.67, 860 32 C860 74.12, 860 116.24, 860 178 C860 199.33, 849.33 210, 828 210 C565.2 210, 302.39 210, 32 210 C10.67 210, 0 199.33, 0 178 C0 131.39, 0 84.79, 0 32 C0 10.67, 10.67 0, 32 0" stroke="none" stroke-width="0" fill="#e7f5ff"></path><path d="M32 0 C291.64 0, 551.28 0, 828 0 M828 0 C849.33 0, 860 10.67, 860 32 M860 32 C860 79.8, 860 127.59, 860 178 M860 178 C860 199.33, 849.33 210, 828 210 M828 210 C556.11 210, 284.21 210, 32 210 M32 210 C10.67 210, 0 199.33, 0 178 M0 178 C0 140.96, 0 103.92, 0 32 M0 32 C0 10.67, 10.67 0, 32 0" stroke="#1971c2" stroke-width="1.5" fill="none" stroke-dasharray="8 9"></path></g><g transform="translate(32 104) rotate(0 250 13)"><text x="0" y="16.1103515625" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="18px" fill="#1971c2" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">① 什么是渲染</text></g><g transform="translate(32 142) rotate(0 350 12)"><text x="0" y="14.3203125" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="16px" fill="#343a40" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">在游戏工业界，图形学 ≈ 渲染（Rendering）</text></g><g transform="translate(32 176) rotate(0 350 12)"><text x="0" y="14.3203125" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="16px" fill="#343a40" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">渲染：计算屏幕上每个像素的颜色 (R, G, B)</text></g><g stroke-linecap="round" transform="translate(32 218) rotate(0 32 32)"><path d="M16 0 C27.11 0, 38.21 0, 48 0 C58.67 0, 64 5.33, 64 16 C64 24.85, 64 33.71, 64 48 C64 58.67, 58.67 64, 48 64 C40.56 64, 33.12 64, 16 64 C5.33 64, 0 58.67, 0 48 C0 35.27, 0 22.54, 0 16 C0 5.33, 5.33 0, 16 0" stroke="none" stroke-width="0" fill="#22b14c"></path><path d="M16 0 C25.72 0, 35.43 0, 48 0 M16 0 C26.82 0, 37.63 0, 48 0 M48 0 C58.67 0, 64 5.33, 64 16 M48 0 C58.67 0, 64 5.33, 64 16 M64 16 C64 26.84, 64 37.69, 64 48 M64 16 C64 24.7, 64 33.39, 64 48 M64 48 C64 58.67, 58.67 64, 48 64 M64 48 C64 58.67, 58.67 64, 48 64 M48 64 C37.92 64, 27.84 64, 16 64 M48 64 C39.13 64, 30.26 64, 16 64 M16 64 C5.33 64, 0 58.67, 0 48 M16 64 C5.33 64, 0 58.67, 0 48 M0 48 C0 36.98, 0 25.96, 0 16 M0 48 C0 36.92, 0 25.83, 0 16 M0 16 C0 5.33, 5.33 0, 16 0 M0 16 C0 5.33, 5.33 0, 16 0" stroke="#2f9e44" stroke-width="1" fill="none"></path></g><g transform="translate(112 226) rotate(0 200 12)"><text x="0" y="14.3203125" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="16px" fill="#343a40" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">1 个像素 = (34, 177, 76)</text></g><g transform="translate(112 258) rotate(0 300 10)"><text x="0" y="12.5302734375" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="14px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">3 个分量：R 红 · G 绿 · B 蓝，各 8 bit → 24 bit 真彩色</text></g><g stroke-linecap="round" transform="translate(12 342) rotate(0 430 95)"><path d="M32 0 C258.38 0, 484.77 0, 828 0 C849.33 0, 860 10.67, 860 32 C860 63.68, 860 95.35, 860 158 C860 179.33, 849.33 190, 828 190 C638.5 190, 449 190, 32 190 C10.67 190, 0 179.33, 0 158 C0 117.05, 0 76.09, 0 32 C0 10.67, 10.67 0, 32 0" stroke="none" stroke-width="0" fill="#fff4e6"></path><path d="M32 0 C251.73 0, 471.46 0, 828 0 M828 0 C849.33 0, 860 10.67, 860 32 M860 32 C860 81.08, 860 130.16, 860 158 M860 158 C860 179.33, 849.33 190, 828 190 M828 190 C546.94 190, 265.89 190, 32 190 M32 190 C10.67 190, 0 179.33, 0 158 M0 158 C0 124.49, 0 90.99, 0 32 M0 32 C0 10.67, 10.67 0, 32 0" stroke="#e8590c" stroke-width="1.5" fill="none" stroke-dasharray="8 9"></path></g><g transform="translate(32 354) rotate(0 250 13)"><text x="0" y="16.1103515625" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="18px" fill="#e8590c" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">② 最基础的渲染器架构</text></g><g transform="translate(32 392) rotate(0 360 50)"><text x="0" y="15.546875" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="16px" fill="#212529" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Color screen_pixels[W][H];                        // 屏幕缓冲：每像素一个颜色</text><text x="0" y="35.546875" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="16px" fill="#212529" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">for (int y = 0; y &lt; H; y++)                       // 遍历每一行</text><text x="0" y="55.546875" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="16px" fill="#212529" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    for (int x = 0; x &lt; W; x++)                   // 遍历每一列</text><text x="0" y="75.546875" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="16px" fill="#212529" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">        screen_pixels[x][y] = RenderPixel(x, y);  // 核心：算这个像素的颜色</text><text x="0" y="95.546875" font-family="Cascadia, monospace, Segoe UI Emoji" font-size="16px" fill="#212529" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">present(screen_pixels);                           // 把缓冲显示到屏幕</text></g><g stroke-linecap="round" transform="translate(28 450) rotate(0 355 12)"><path d="M6 0 C258.07 0, 510.14 0, 704 0 M704 0 C708 0, 710 2, 710 6 M710 6 C710 9.29, 710 12.58, 710 18 M710 18 C710 22, 708 24, 704 24 M704 24 C424.88 24, 145.76 24, 6 24 M6 24 C2 24, 0 22, 0 18 M0 18 C0 13.32, 0 8.64, 0 6 M0 6 C0 2, 2 0, 6 0" stroke="#e8590c" stroke-width="1.75" fill="none" stroke-dasharray="8 9.25"></path></g><g transform="translate(32 500) rotate(0 390 11)"><text x="0" y="13.42529296875" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="15px" fill="#e8590c" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">RenderPixel(x, y) 是渲染器的核心 —— 后续所有阶段，本质都在回答「一个像素的颜色怎么算」</text></g><g stroke-linecap="round" transform="translate(12 572) rotate(0 430 85)"><path d="M32 0 C329.79 0, 627.58 0, 828 0 C849.33 0, 860 10.67, 860 32 C860 53.57, 860 75.15, 860 138 C860 159.33, 849.33 170, 828 170 C637.28 170, 446.57 170, 32 170 C10.67 170, 0 159.33, 0 138 C0 96.13, 0 54.25, 0 32 C0 10.67, 10.67 0, 32 0" stroke="none" stroke-width="0" fill="#ebfbee"></path><path d="M32 0 C303.56 0, 575.13 0, 828 0 M828 0 C849.33 0, 860 10.67, 860 32 M860 32 C860 62.63, 860 93.25, 860 138 M860 138 C860 159.33, 849.33 170, 828 170 M828 170 C637.52 170, 447.05 170, 32 170 M32 170 C10.67 170, 0 159.33, 0 138 M0 138 C0 113.1, 0 88.2, 0 32 M0 32 C0 10.67, 10.67 0, 32 0" stroke="#2f9e44" stroke-width="1.5" fill="none" stroke-dasharray="8 9"></path></g><g transform="translate(32 584) rotate(0 250 13)"><text x="0" y="16.1103515625" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="18px" fill="#2f9e44" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">③ 渲染器长什么样</text></g><g stroke-linecap="round" transform="trans