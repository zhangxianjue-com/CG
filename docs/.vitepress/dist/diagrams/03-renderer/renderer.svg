pace: pre;" direction="ltr" dominant-baseline="alphabetic">两条主流路线：光栅化（逐三角形投影 → 填像素） · 光线追踪（逐像素发射光线求交）</text></g><g transform="translate(12 782) rotate(0 250 13)"><text x="0" y="16.1103515625" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="18px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">④ 踩坑记录</text></g><g transform="translate(12 818) rotate(0 420 22)"><text x="0" y="14.3203125" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="16px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">先做离线渲染：像素写进 PPM 文件再打开看，比直接上窗口 / GPU 简单一个数量级</text><text x="0" y="34.3203125" font-family="Helvetica, sans-serif, Segoe UI Emoji" font-size="16px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">调试时把像素涂成纯色（纯红 / 纯绿），一眼看出坐标与循环边界是否正确</text></g></svg>